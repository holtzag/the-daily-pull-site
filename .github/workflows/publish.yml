name: Publish The Daily Pull beta

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private repository token is configured
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          if [ -z "$PRIVATE_SOURCE_TOKEN" ]; then
            echo "::error::PRIVATE_SOURCE_TOKEN is empty or unavailable. Update the repository Actions secret with the token value."
            exit 1
          fi
          echo "Private source token is present (value hidden)."

      - name: Check out private game source
        uses: actions/checkout@v4
        with:
          repository: holtzag/the-daily-pull
          ref: main
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: game
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build website
        working-directory: game
        env:
          GITHUB_PAGES_BASE: /the-daily-pull-site/
          PUBLISH_ALL_PUZZLES: 'true'
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the built website and puzzle assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
